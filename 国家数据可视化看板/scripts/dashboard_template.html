<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="国家统计局真实数据驱动的四主题交互驾驶舱">
  <title>__TITLE__ · 国家数据驾驶舱</title>
  <link rel="stylesheet" href="__ASSETS__style.css?v=__REV__">
  <script src="__ASSETS__echarts.min.js"></script>
</head>
<body>
<!-- THESIS: 四个统计主题各自成屏，以同一时间轴连接规模、结构和变化，忠实延续用户的浅色参考图。
OWN-WORLD: 雾蓝底色、白色图面、青蓝与低饱和分类色、深色无衬线中文、紧凑工具栏和清晰数字。
STORY: 选主题，读总览，切换年份与口径，沿图形查看结构差异，导出可核查数据。
FIRST VIEWPORT: 顶部四主题导航，标题与操作区，联动时间轴，六项指标，宽主图和侧图；后续成组展开。
FORM: 用户提供的季度GDP、教育和旅游驾驶舱为视觉约束；pinned-reference-20261119；code-led。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
<a href="#content" class="skip-link">跳到图表</a>
<header class="site-header">
  <a class="brand" href="__HOME__"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M10 19V5M16 19V9M22 19H2"/></svg><span>国家数据驾驶舱</span></a>
  <nav aria-label="主题导航">__NAV__</nav>
  <span class="byline">曹俊男 · 大数据241</span>
</header>
<main>
  <div class="page-heading">
    <div><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div>
    <div class="actions"><button id="downloadCsv" class="button">导出数据</button><button id="openSources" class="button">数据口径</button><button id="fullscreen" class="button icon-button" aria-label="全屏展示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
  </div>
  <section class="control-bar" aria-label="看板筛选">
    <div class="period-controls"><span class="control-label" id="periodLabel">观察年份</span><button class="step-button" id="prev" aria-label="上一个时期">‹</button><input id="timeline" type="range" min="0" step="1" aria-label="观察时期"><button class="step-button" id="next" aria-label="下一个时期">›</button><label class="sr-only" for="period">观察时期</label><select id="period"></select></div>
    <div class="range-controls"><label for="rangeStart">区间</label><select id="rangeStart" aria-label="区间起点"></select><span class="range-to">至</span><select id="rangeEnd" aria-label="区间终点"></select></div>
    <div id="modeSwitch" class="segmented" aria-label="数据口径" hidden><button data-mode="current" aria-pressed="true">当季值</button><button data-mode="cumulative" aria-pressed="false">累计值</button></div>
    <button id="play" class="button primary" aria-pressed="false">播放</button><button id="reset" class="button">重置</button>
  </section>
  <fieldset id="categoryFilters" class="category-filters" hidden><legend>观察学段</legend><div id="categoryChoices"></div><span>仅影响按学段统计的图表</span></fieldset>
  <section id="kpis" class="kpi-grid" aria-label="核心指标"></section>
  <p class="insight" id="insight" aria-live="polite"></p>
  <div id="content"></div>
  <section class="data-section" aria-label="数据明细"><div class="section-heading"><div><h2>数据明细</h2><p>当前观察期的数值与实际公布年份</p></div><button id="downloadSnapshot" class="button">导出当前期</button></div><div class="table-scroll"><table><thead><tr><th>指标</th><th>数值</th><th>单位</th><th>时期</th></tr></thead><tbody id="detailRows"></tbody></table></div></section>
  <footer><span>国家统计局 · 国家数据</span><span>Python 数据整理 / ECharts 交互呈现</span><a href="https://github.com/YDZ-R/-" target="_blank" rel="noopener">项目仓库<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4 10 14M10 5H5v14h14v-5"/></svg></a></footer>
</main>
<dialog id="sourceDialog" aria-labelledby="sourceTitle"><div class="dialog-heading"><h2 id="sourceTitle">数据来源与统计口径</h2><button class="button close-dialog" data-close="sourceDialog" aria-label="关闭数据口径">关闭</button></div><div class="source-content"><p>数据查询入口：<a href="https://data.stats.gov.cn/dg/website/page.html#/pc/national/home" target="_blank" rel="noopener">国家统计局国家数据</a>。采集日期：2026-11-19。</p><p>原始查询快照、官方Excel核对文件、数据字典和处理代码均随项目归档。空白不补零，不生成未公布数据。</p><ul id="sourceNotes"></ul></div></dialog>
<dialog id="chartDialog" aria-labelledby="expandedTitle"><div class="dialog-heading"><h2 id="expandedTitle"></h2><div><button id="savePng" class="button">保存PNG</button><button class="button close-dialog" data-close="chartDialog">关闭</button></div></div><div id="expandedChart"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<noscript>请启用JavaScript以使用交互图表。原始和清洗数据也可在项目data目录中查看。</noscript>
<script>const DASHBOARD=__DATA__;</script>
<script src="__ASSETS__app.js?v=__REV__"></script>
</body>
</html>
